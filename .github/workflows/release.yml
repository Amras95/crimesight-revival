# Cada vez que se sube algo a main: compila el lanzador en Windows y en Linux y publica una release nueva.
# Los lanzadores ya instalados la detectan al abrirse y la ofrecen con sus novedades (tools/release_notes.py).
name: Compilar y publicar

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", ".github/FUNDING.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Serie de versiones: para pasar a la siguiente (1.3, 2.0...) basta con cambiar esto. El ultimo numero cuenta
# las releases ya publicadas de la serie: la primera es X.Y.0, luego X.Y.1, X.Y.2...
env:
  SERIES: "1.2"

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # hace falta el historial para saber si CHANGELOG.md cambia en esta subida

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Version
        id: ver
        shell: bash
        run: |
          git fetch --tags --force --quiet
          n=$(git tag -l "v${SERIES}.*" | wc -l)
          echo "version=${SERIES}.$((n))" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: python tools/build_exe.py ${{ steps.ver.outputs.version }}

      - name: Huella SHA-256
        id: sha
        shell: bash
        run: echo "sha256=$(sha256sum dist/CrimeSightRevival.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Novedades: el primer bloque de CHANGELOG.md si cambia en esta subida; si no, el mensaje del commit
      - name: Notas de la version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python tools/release_notes.py "${{ steps.sha.outputs.sha256 }}" "${{ github.event.before }}" notas.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CRIMESIGHT Revival ${{ steps.ver.outputs.version }}
          files: dist/CrimeSightRevival.exe
          body_path: notas.md

  # Version para Linux / Steam Deck (la interfaz se abre en el navegador). Se anade a la misma release.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar
        run: |
          python tools/build_exe.py ${{ needs.release.outputs.version }}
          mv dist/CrimeSightRevival dist/CrimeSightRevival-linux
          chmod +x dist/CrimeSightRevival-linux

      - name: Añadir a la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: dist/CrimeSightRevival-linux
