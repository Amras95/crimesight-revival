# Every push to main: builds the launcher on Windows and Linux and publishes a new release.
# Already installed launchers detect it when they open and offer it with its release notes (tools/release_notes.py).
name: Compilar y publicar

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", ".github/FUNDING.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Version series: to move to the next one (1.3, 2.0...) just change this. The last number counts
# the releases already published in the series: the first is X.Y.0, then X.Y.1, X.Y.2...
env:
  SERIES: "1.3"

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the history is needed to know whether CHANGELOG.md changes in this push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Version
        id: ver
        shell: bash
        run: |
          git fetch --tags --force --quiet
          n=$(git tag -l "v${SERIES}.*" | wc -l)
          echo "version=${SERIES}.$((n))" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: python tools/build_exe.py ${{ steps.ver.outputs.version }}

      - name: Huella SHA-256
        id: sha
        shell: bash
        run: echo "sha256=$(sha256sum dist/CrimeSightRevival.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Release notes: the first block of CHANGELOG.md if it changes in this push; otherwise, the commit message
      - name: Notas de la version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python tools/release_notes.py "${{ steps.sha.outputs.sha256 }}" "${{ github.event.before }}" notas.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CRIMESIGHT Revival ${{ steps.ver.outputs.version }}
          files: dist/CrimeSightRevival.exe
          body_path: notas.md

  # Linux / Steam Deck version (the interface opens in the browser). Added to the same release.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar
        run: |
          python tools/build_exe.py ${{ needs.release.outputs.version }}
          mv dist/CrimeSightRevival dist/CrimeSightRevival-linux
          chmod +x dist/CrimeSightRevival-linux

      # With gh and retries: the upload sometimes gets cut ("other side closed") and there's no need to rebuild.
      - name: Añadir a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.release.outputs.version }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" dist/CrimeSightRevival-linux --clobber && exit 0
            echo "La subida ha fallado (intento $i de 5); reintento en 20 s"
            sleep 20
          done
          exit 1
