<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRIMESIGHT Revival</title>
<style>
:root{
  --bg:#07081a; --panel:rgba(14,16,40,.78); --panel2:rgba(22,24,58,.9); --line:rgba(150,160,255,.18);
  --text:#e9e8ff; --dim:#a3a6cf; --accent:#6f7bff;
  --sherlock:#4fe3ff; --moriarty:#ff6a3d; --watson:#5d8dff; --irene:#e04dff;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;user-select:none}
#bg{position:fixed;inset:0;background:var(--bg) center/cover no-repeat;filter:saturate(.9)}
#bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(1200px 600px at 75% 15%,rgba(80,70,255,.35),transparent 60%),
    radial-gradient(900px 500px at 10% 100%,rgba(255,110,40,.18),transparent 60%),
    linear-gradient(180deg,rgba(7,8,26,.55),rgba(7,8,26,.92) 70%);
  mix-blend-mode:normal}
#bg.tint{background-blend-mode:luminosity}
.app{position:relative;height:100%;display:flex;flex-direction:column;padding:22px 30px 16px}

/* cabecera */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.brand{line-height:1}
.brand .name{font-family:var(--serif);font-size:44px;letter-spacing:.18em;font-weight:700;
  background:linear-gradient(180deg,#fff,#c9ccff);-webkit-background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(120,130,255,.35)}
.brand .rev{display:inline-block;margin-left:10px;font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.55em;
  color:#fff;padding:5px 4px 5px 12px;border:1px solid rgba(255,255,255,.35);border-radius:3px;vertical-align:middle;
  background:linear-gradient(90deg,rgba(111,123,255,.45),rgba(224,77,255,.35))}
.brand .tag{margin-top:8px;color:var(--dim);font-size:13px;letter-spacing:.06em}
.me{display:flex;gap:10px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
.chip small{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.chip b{font-size:15px}
.bell{display:none;position:relative;align-self:stretch;align-items:center;justify-content:center;color:var(--text);cursor:pointer;font:inherit}
.bell.on{display:flex}.bell:hover{border-color:rgba(255,255,255,.35)}
.bell .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#ff5a7a;box-shadow:0 0 0 0 rgba(255,90,122,.7);animation:belldot 1.8s infinite}
@keyframes belldot{0%{box-shadow:0 0 0 0 rgba(255,90,122,.7)}70%{box-shadow:0 0 0 9px rgba(255,90,122,0)}100%{box-shadow:0 0 0 0 rgba(255,90,122,0)}}
#update .closewarn{display:none;color:#ffb37a}#update .closewarn.on{display:block}
.stats{display:flex;gap:14px}
.stats div{text-align:center;min-width:44px}
.stats b{display:block;font-size:20px}
.stats .w b{color:#7dffb0}.stats .d b{color:#ffd36b}.stats .l b{color:#ff8a8a}.stats .p b{color:#c9b8ff}

/* tarjetas */
.cards{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:22px 0 14px;min-height:0}
.card{--c:var(--accent);position:relative;border-radius:18px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.25)),var(--panel);
  border:1px solid var(--line);transition:transform .25s ease,border-color .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,transparent);
  box-shadow:0 18px 50px -18px color-mix(in srgb,var(--c) 70%,transparent)}
.card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 20px 60px -20px var(--c)}
.card .art{flex:1;min-height:120px;background:center 12%/cover no-repeat;position:relative;
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%);
  transition:transform .6s ease}
.card:hover .art{transform:scale(1.04)}
.card .glow{position:absolute;inset:auto 0 0 0;height:60%;background:radial-gradient(80% 70% at 50% 100%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);pointer-events:none}
.card .body{position:relative;padding:0 18px 18px}
.card .role{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--c);font-weight:700}
.card h2{margin:4px 0 6px;font-family:var(--serif);font-size:24px;font-weight:700}
.card p{margin:0;color:var(--dim);font-size:13px;line-height:1.45;min-height:57px}
.c-sherlock{--c:var(--sherlock)} .c-moriarty{--c:var(--moriarty)} .c-watson{--c:var(--watson)} .c-irene{--c:var(--irene)}

/* panel de accion */
.panel{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:center;min-height:86px;backdrop-filter:blur(10px)}
.panel .fields{flex:1;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
input,select{background:rgba(5,6,20,.7);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;outline:none;min-width:120px}
input:focus,select:focus{border-color:var(--c,var(--accent))}
.hint{color:var(--dim);font-size:13px;max-width:520px;line-height:1.45}
.btn{border:0;border-radius:12px;padding:13px 26px;font:700 15px var(--sans);letter-spacing:.08em;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 45%,#2a1d6e));
  box-shadow:0 10px 30px -10px var(--c,var(--accent));transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--dim);font-weight:600;padding:9px 14px;letter-spacing:.02em}
.btn.ghost:hover{color:var(--text);border-color:rgba(255,255,255,.35)}
.btn.small{padding:9px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;filter:none}

/* sesion en marcha */
.session{display:none;gap:16px;align-items:stretch}
.session.on{display:flex}
.session .status{min-width:260px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7dffb0;margin-right:8px;box-shadow:0 0 0 0 rgba(125,255,176,.7);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(125,255,176,0)}100%{box-shadow:0 0 0 0 rgba(125,255,176,0)}}
.addr{display:none;align-items:center;gap:8px;background:rgba(5,6,20,.7);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.addr.on{display:flex}.addr code{font-size:17px;color:#fff;letter-spacing:.04em}
#log{flex:1;height:120px;overflow:auto;background:rgba(3,4,14,.75);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  font:12.5px/1.55 Consolas,"Cascadia Mono",monospace;color:#c8cbf0;user-select:text}
#log .err{color:#ff9a9a}#log .ok{color:#9dffc4}

footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--dim);font-size:12px;gap:12px}
footer>span{white-space:nowrap;flex-shrink:0}
footer .path{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
footer a{color:#c9ccff;text-decoration:none}
footer a.kofi{color:#ffb37a}footer a:hover{text-decoration:underline}
footer .ver{margin-left:8px;opacity:.6}
footer .updpill{display:none;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;text-decoration:none}
footer .updpill.on{display:inline-block}
#update .box{display:flex;flex-direction:column;max-height:86vh}
.updnotes{overflow:auto;min-height:60px;background:rgba(5,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.5}
.updnotes .v{font-weight:600;margin:10px 0 4px}
.updnotes .v:first-child{margin-top:0}
.updnotes .v span{font-weight:400;color:var(--dim);margin-left:6px;font-size:12px}
.updnotes ul{margin:0;padding-left:18px}
.updnotes .ln{margin:2px 0}
.updnotes .none{color:var(--dim);font-style:italic}
.toast{position:fixed;left:50%;bottom:26px;z-index:6;max-width:80vw;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d1f4a;border:1px solid var(--line);
  padding:10px 16px;border-radius:10px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);z-index:5;transition:opacity .4s}
.loading.off{opacity:0;pointer-events:none}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
/* ventana de progreso */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,5,16,.72);backdrop-filter:blur(4px);z-index:4}
.modal.on{display:flex}
.modal .box{width:560px;max-width:92vw;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.modal h3{margin:0 0 6px;font-family:var(--serif);font-size:24px}
.modal p{margin:0 0 14px;color:var(--dim);font-size:13px;line-height:1.5}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.modal .sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.modal .dir{background:rgba(5,6,20,.7);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;
  margin-bottom:10px;word-break:break-all;user-select:text}
.modal .dir.off{color:var(--dim);font-style:italic}
.modal .close{display:flex;justify-content:flex-end;margin-top:6px}
/* mods */
.modal .box.wide{width:640px}
/* ventana de mods: casi a pantalla completa, por pestañas; solo baja lo de dentro */
.modal .box.full{width:min(1100px,96vw);height:92vh;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:600 14px var(--sans);padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tabbody{flex:1;min-height:0;overflow:auto;padding-right:4px}
.pane{display:none}.pane.on{display:block}
.modal .box.full .mods{max-height:none}
.modal p.note{color:#c9ccff}
.modal .box.full .mod .info{flex:0 0 220px}
.mod .thumbs.big{flex:1;flex-wrap:wrap;min-width:0}
.mod .thumbs.big img{width:48px;height:48px}
#modelslist .mod select{min-width:200px}
.mods{max-height:46vh;overflow:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.mod{display:flex;align-items:center;gap:12px;background:rgba(5,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mod.off{opacity:.55}
.mod .thumbs{display:flex;gap:4px;flex-shrink:0}
.mod .thumbs img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.05)}
.mod .info{flex:1;min-width:0}
.mod .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .info small{color:var(--dim);font-size:12px}
.mod .info .warn{color:#ffb37a}
.modal .empty{color:var(--dim);font-style:italic;padding:12px 0}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.bep{display:flex;align-items:center;gap:12px;background:rgba(5,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bep.off img{opacity:.35}.bep .info{flex:1;min-width:0}.bep .warn{display:block;color:#ffb37a;margin-top:6px;user-select:text}.bep .info b{display:block;margin-bottom:2px}.bep .info small{color:var(--dim);font-size:12px;line-height:1.45}
.bep.cur{flex-direction:column;align-items:stretch;gap:10px}.bep.cur .currow{display:flex;align-items:center;gap:12px;min-width:0}
.bep.cur .curctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.bep.cur .curctl select{min-width:0;padding:8px 10px;font-size:13px}
.bep.cur .info small{display:block}
.stxt{display:flex;align-items:center;gap:12px;background:rgba(5,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stxt img{width:48px;height:48px;object-fit:contain;flex-shrink:0}
.stxt input{flex:1;min-width:0}
.modlist{background:rgba(5,6,20,.6);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px;line-height:1.7}
</style>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="bg"></div>
<div class="loading" id="loading"><div class="spinner"></div><div id="loadmsg" data-t="loading">Preparing the launcher…</div></div>

<div class="app">
  <header>
    <div class="brand">
      <span class="name">CRIMESIGHT</span><span class="rev">REVIVAL</span>
      <div class="tag" data-t="tagline"></div>
    </div>
    <div class="me">
      <button class="chip bell" id="bell" onclick="showUpdate()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <div class="chip"><small data-t="steam_account"></small><b id="acc">—</b></div>
      <div class="chip stats">
        <div class="w"><b id="sw">0</b><small data-t="wins"></small></div>
        <div class="d"><b id="sd">0</b><small data-t="draws"></small></div>
        <div class="l"><b id="sl">0</b><small data-t="losses"></small></div>
        <div class="p"><b id="sp">0</b><small data-t="points"></small></div>
      </div>
    </div>
  </header>

  <section class="cards" id="cards">
    <div class="card c-sherlock" data-mode="solo">
      <div class="art" data-art="sherlock"></div><div class="glow"></div>
      <div class="body"><div class="role">Sherlock</div><h2 data-t="solo_title"></h2><p data-t="solo_desc"></p></div>
    </div>
    <div class="card c-moriarty" data-mode="host">
      <div class="art" data-art="moriarty"></div><div class="glow"></div>
      <div class="body"><div class="role">Moriarty</div><h2 data-t="host_title"></h2><p data-t="host_desc"></p></div>
    </div>
    <div class="card c-watson" data-mode="join">
      <div class="art" data-art="watson"></div><div class="glow"></div>
      <div class="body"><div class="role">Watson</div><h2 data-t="join_title"></h2><p data-t="join_desc"></p></div>
    </div>
    <div class="card c-irene" data-mode="server">
      <div class="art" data-art="irene"></div><div class="glow"></div>
      <div class="body"><div class="role">Irene</div><h2 data-t="server_title"></h2><p data-t="server_desc"></p></div>
    </div>
  </section>

  <div class="panel" id="panel"></div>

  <div class="panel session" id="session">
    <div class="status">
      <div><span class="pulse"></span><b id="sesstitle" data-t="session_running"></b></div>
      <div class="addr" id="addr"><code id="addrtxt"></code><button class="btn ghost small" onclick="copyAddr()" data-t="copy"></button></div>
      <button class="btn small" id="stopbtn" onclick="stopSession()" data-t="stop_session"></button>
    </div>
    <div id="log"></div>
  </div>

  <footer>
    <span class="path" id="gamepath"></span>
    <span>
      <button class="btn ghost small" onclick="pickGame()" data-t="change_folder"></button>
      <button class="btn ghost small" onclick="restoreGame()" data-t="restore_game"></button>
      <button class="btn ghost small" onclick="openProgress()" data-t="progress_btn"></button>
      <button class="btn ghost small" onclick="openMods()" data-t="mods_btn"></button>
    </span>
    <span><span data-t="revival_by"></span> <a href="#" onclick="api('open_url','https://github.com/Amras95');return false">Amras95</a> ·
      <a href="#" onclick="api('open_url','https://x.com/AmrasMithandir');return false">@AmrasMithandir</a> ·
      <a href="#" class="kofi" onclick="api('open_url',STATE.kofi);return false">☕ <span data-t="kofi"></span></a>
      <span class="ver" id="ver"></span><a href="#" class="updpill" id="updpill" onclick="showUpdate();return false"></a></span>
  </footer>
</div>
<div class="modal" id="progress" onclick="if(event.target===this)closeProgress()">
  <div class="box">
    <h3 data-t="progress_title"></h3>
    <p data-t="progress_desc"></p>
    <div class="row">
      <button class="btn small" onclick="exportProgress()" data-t="export_btn"></button>
      <button class="btn ghost small" onclick="importProgress()" data-t="import_btn"></button>
    </div>
    <div class="sub" data-t="backup_label"></div>
    <div class="dir" id="backupdir"></div>
    <div class="row">
      <button class="btn ghost small" onclick="pickBackup()" data-t="backup_pick"></button>
      <button class="btn ghost small" id="backupclear" onclick="clearBackup()" data-t="backup_remove"></button>
    </div>
    <p data-t="backup_hint"></p>
    <div class="close"><button class="btn ghost small" onclick="closeProgress()" data-t="close"></button></div>
  </div>
</div>
<div class="modal" id="mods" onclick="if(event.target===this)closeMods()">
  <div class="box full">
    <h3 data-t="mods_title"></h3>
    <p data-t="mods_desc"></p>
    <div class="tabs" id="modtabs">
      <button class="tab" data-tab="general" onclick="modTab('general')" data-t="mods_tab_general"></button>
      <button class="tab" data-tab="stickers" onclick="modTab('stickers')" data-t="mods_tab_stickers"></button>
      <button class="tab" data-tab="avatars" onclick="modTab('avatars')" data-t="mods_tab_avatars"></button>
      <button class="tab" data-tab="cursor" onclick="modTab('cursor')" data-t="mods_cursor"></button>
      <button class="tab" data-tab="models" onclick="modTab('models')" data-t="mods_tab_models"></button>
    </div>
    <div class="tabbody">
      <div class="pane" data-pane="general">
        <div class="sub" data-t="bep_title"></div>
        <div class="bep">
          <div class="info"><b id="bepstatus"></b><small data-t="bep_desc"></small>
            <small id="beplinux" class="warn" style="display:none"></small></div>
          <button class="btn ghost small" id="bepbtn" onclick="toggleBep()"></button>
        </div>
        <p id="modsrestart" data-t="mods_restart"></p>
        <div class="sub" data-t="guest_mods_title"></div>
        <div class="bep cur">
          <div class="currow"><div class="info"><small data-t="guest_mods_desc"></small></div></div>
          <div class="curctl">
            <select id="guestmods" class="small" onchange="guestMods(this.value)">
              <option value="ask" data-t="guest_mods_ask"></option><option value="always" data-t="guest_mods_always"></option>
            </select>
          </div>
        </div>
      </div>
      <div class="pane" data-pane="stickers">
        <p data-t="mods_how"></p>
        <p data-t="mods_text_hint"></p>
        <p class="note" data-t="mods_toggle_note"></p>
        <div class="mods" id="modlist_stickers"></div>
      </div>
      <div class="pane" data-pane="avatars">
        <p data-t="mods_how"></p>
        <p class="note" data-t="mods_toggle_note"></p>
        <div class="mods" id="modlist_avatars"></div>
      </div>
      <div class="pane" data-pane="models">
        <p data-t="models_desc"></p>
        <p class="note" id="modelsbep" data-t="models_need_bep" style="display:none"></p>
        <div class="mods" id="modelslist"></div>
      </div>
      <div class="pane" data-pane="cursor">
        <div class="bep cur" id="cursorbox">
          <div class="currow">
            <img id="curimg" alt="" style="width:32px;height:32px;flex:none;display:none">
            <div class="info"><b id="curstatus"></b><small id="curdesc"></small></div>
          </div>
          <div class="curctl">
            <select id="curhot" class="small" onchange="cursorHot(this.value)" style="display:none">
              <option value="tip" data-t="cursor_hot_tip"></option><option value="center" data-t="cursor_hot_center"></option>
              <option value="custom" data-t="cursor_hot_custom" disabled></option>
            </select>
            <button class="btn ghost small" onclick="cursorPick()" data-t="cursor_pick"></button>
            <button class="btn ghost small" id="curtoggle" onclick="cursorToggle()" style="display:none"></button>
            <button class="btn ghost small" onclick="cursorFolder()" data-t="cursor_folder"></button>
          </div>
        </div>
      </div>
    </div>

<script>
const $=s=>document.querySelector(s);
let STATE=null, MODE='solo', BUSY=false, TX={};
function T(k,v){let s=TX[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function applyT(){document.querySelectorAll('[data-t]').forEach(e=>{if(TX[e.dataset.t])e.textContent=TX[e.dataset.t]})}

function api(name,...args){
  if(window.CSR_HTTP) return fetch('api/'+name,{method:'POST',body:JSON.stringify(args)})
    .then(r=>r.json()).then(j=>j.result===undefined?null:j.result).catch(()=>null);
  if(window.pywebview&&window.pywebview.api) return window.pywebview.api[name](...args);
  return (window.MOCK&&window.MOCK[name])?Promise.resolve(window.MOCK[name](...args)):Promise.resolve(null);
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),Math.max(2200,t.length*55))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const PANELS={
  solo:()=>`<div class="fields"><div class="hint">${esc(T('solo_hint'))}</div></div>
    <button class="btn" onclick="start('solo')">${esc(T('play_btn'))}</button>`,
  host:()=>`<div class="fields"><div class="field"><label>${esc(T('port'))}</label><input id="port" value="${esc(STATE.port||18080)}" style="width:110px"></div>
    <div class="hint">${esc(T('host_hint'))}</div></div>
    <button class="btn" onclick="start('host')">${esc(T('host_btn'))}</button>`,
  join:()=>`<div class="fields"><div class="field" style="flex:1"><label>${esc(T('friend_addr'))}</label><input id="friend" placeholder="${esc(T('friend_ph'))}" value="${esc(STATE.last_friend||'')}"></div></div>
    <button class="btn" onclick="start('join')">${esc(T('join_btn'))}</button>`,
  server:()=>`<div class="fields">
      <div class="field"><label>${esc(T('saved'))}</label><select id="saved" onchange="pickSaved()"><option value="">—</option>${(STATE.servers||[]).map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>${esc(T('name'))}</label><input id="sname" style="width:150px"></div>
      <div class="field" style="flex:1"><label>${esc(T('address'))}</label><input id="saddr" placeholder="${esc(T('server_ph'))}"></div>
      <div class="field"><label>${esc(T('password'))}</label><input id="spw" type="password" style="width:150px"></div>
      <button class="btn ghost small" onclick="saveServer()">${esc(T('save'))}</button>
      <button class="btn ghost small" onclick="deleteServer()">${esc(T('delete'))}</button></div>
    <button class="btn" onclick="start('server')">${esc(T('connect_btn'))}</button>`,
};

function selectMode(m){
  MODE=m;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.mode===m));
  const color=getComputedStyle(document.querySelector(`.card[data-mode="${m}"]`)).getPropertyValue('--c');
  $('#panel').style.setProperty('--c',color);$('#session').style.setProperty('--c',color);
  if(!BUSY) $('#panel').innerHTML=PANELS[m]();
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{ if(!BUSY) selectMode(c.dataset.mode)}));

function render(s){
  STATE=s;
  if(s.i18n){TX=s.i18n;document.documentElement.lang=s.lang||'en';applyT()}
  $('#acc').textContent=s.account||T('no_steam');
  if(s.version)$('#ver').textContent=s.version==='dev'?'dev':'v'+s.version;
  const r=s.record||{};$('#sw').textContent=r.w||0;$('#sd').textContent=r.d||0;$('#sl').textContent=r.l||0;
  $('#sp').textContent=(r.p||0).toLocaleString(s.lang||'en');
  $('#gamepath').textContent=s.game_dir?T('game_path',{path:s.game_dir}):T('no_game');
  if(s.art){
    if(s.art.city) $('#bg').style.backgroundImage=`url(${s.art.city})`;
    document.querySelectorAll('[data-art]').forEach(e=>{const a=s.art[e.dataset.art]; if(a) e.style.backgroundImage=`url(${a})`});
  }
  if(!BUSY) selectMode(MODE);
  if(s.notice) toast(s.notice);
}

async function start(mode){
  const args={};
  if(mode==='host') args.port=$('#port').value;
  if(mode==='join') args.address=$('#friend').value;
  if(mode==='server'){args.address=$('#saddr').value;args.password=$('#spw').value}
  const r=await api('start',mode,args);
  if(r&&r.error){toast(r.error);return}
}
function stopSession(){api('stop');$('#stopbtn').disabled=true}
function copyAddr(){api('copy',$('#addrtxt').textContent);toast(T('copied'))}
async function pickGame(){const s=await api('pick_game');if(s)render(s)}
async function restoreGame(){const t=await api('restore');if(t)toast(t)}
function pickSaved(){const n=$('#saved').value;const s=(STATE.servers||[]).find(x=>x.name===n);if(!s)return;
  $('#sname').value=s.name;$('#saddr').value=s.address;$('#spw').value=s.password||''}
async function saveServer(){const s=await api('save_server',$('#sname').value,$('#saddr').value,$('#spw').value);if(s){render(s);toast(T('server_saved'))}}
async function deleteServer(){const s=await api('delete_server',$('#saved').value);if(s)render(s)}

function renderBackup(){const d=STATE&&STATE.backup_dir;const e=$('#backupdir');
  e.textContent=d||T('backup_off');e.classList.toggle('off',!d);$('#backupclear').style.display=d?'':'none'}
function openProgress(){renderBackup();$('#progress').classList.add('on')}
function closeProgress(){$('#progress').classList.remove('on')}
function done(r){if(!r)return;if(r.state)render(r.state);renderBackup();if(r.msg)toast(r.msg)}
async function exportProgress(){done(await api('export_progress'))}
async function importProgress(){done(await api('import_progress'))}
async function pickBackup(){done(await api('pick_backup'))}
async function clearBackup(){done(await api('clear_backup'))}

/* mods de apariencia */
function modCount(m){return T('mods_count',{stickers:m.stickers,avatars:m.avatars})}
function modRow(m,kind){
  const th=(kind==='avatars'?m.avatar_thumbs:m.sticker_thumbs)||m.thumbs||[];
  return `<div class="mod${m.enabled?'':' off'}">
    <div class="info"><b>${esc(m.name)}</b><small>${esc(modCount(m))}${m.author?' · '+esc(T('mods_by',{author:m.author})):''}</small>
      ${m.errors?`<small class="warn"> · ${esc(T('mods_bad_images',{n:m.errors}))}</small>`:''}</div>
    <div class="thumbs big">${th.map(u=>`<img src="${u}">`).join('')}</div>
    ${kind==='stickers'?`<button class="btn ghost small" onclick="openTexts(${esc(JSON.stringify(m.folder))})">${esc(T('mods_texts_btn'))}</button>`:''}
    <button class="btn ghost small" onclick="toggleMod(${esc(JSON.stringify(m.folder))},${!m.enabled})">${esc(T(m.enabled?'mods_on':'mods_off'))}</button>
  </div>`;
}
async function loadMods(){
  const r=await api('mods_list');
  for(const kind of ['stickers','avatars']){
    const L=$('#modlist_'+kind);
    if(!r){L.innerHTML='';continue}
    const ms=r.mods.filter(m=>m[kind]>0);
    L.innerHTML=ms.length?ms.map(m=>modRow(m,kind)).join('')
      :`<div class="empty">${esc(T(r.mods.length?(kind==='avatars'?'mods_none_avatars':'mods_none_stickers'):'mods_empty'))}</div>`;
  }
}
let MODELS=null;
async function loadModels(){
  const r=await api('models_state');if(!r)return;MODELS=r;
  $('#modelsbep').style.display=r.live?'none':'block';
  $('#modelslist').innerHTML=r.slots.map(s=>{
    const cur=r.swaps[s.id]||'';
    const opts=[`<option value="">${esc(T('models_original'))}</option>`].concat(
      r.targets.filter(x=>x.id!==s.id).map(x=>`<option value="${esc(x.id)}"${x.id===cur?' selected':''}>${esc(x.name)}</option>`)).join('');
    return `<div class="mod${cur?'':' plain'}"><div class="info"><b>${esc(s.name)}</b>
      <small>${esc(cur?T('models_now',{name:(r.targets.find(x=>x.id===cur)||{}).name||cur}):T('models_original'))}</small></div>
      <select class="small" onchange="setModel(${esc(JSON.stringify(s.id))},this.value)">${opts}</select></div>`;
  }).join('');
}
async function setModel(slot,target){const r=await api('models_set',slot,target);if(r&&r.error){toast(r.error);return}loadModels()}
let MODTAB='general';
function modTab(t){
  MODTAB=t;
  document.querySelectorAll('#modtabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('#mods .pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===t));
  $('#mods .tabbody').scrollTop=0;
}
async function newMod(){await api('mods_new');loadMods()}
async function toggleMod(folder,on){await api('mods_toggle',folder,on);loadMods()}
let BEP=null;
async function loadBep(){
  BEP=await api('bep_state');if(!BEP)return;
  $('#bepstatus').textContent=T(BEP.plugin?(BEP.ready?'bep_status_on':'bep_status_first'):'bep_status_off');
  $('#bepbtn').textContent=T(BEP.plugin?'bep_disable':'bep_enable');$('#bepbtn').disabled=false;
  $('#modsrestart').textContent=T(BEP.plugin?'mods_live_restart':'mods_restart');
  const L=$('#beplinux');
  if(BEP.linux&&BEP.plugin&&BEP.launch_ok!==true){L.style.display='block';L.textContent=T('bep_linux_note',{opt:BEP.launch_option})}
  else L.style.display='none';
}
async function toggleBep(){
  const r=await api(BEP&&BEP.plugin?'bep_uninstall':'bep_install');
  if(!r)return; if(r.error){toast(r.error);return}
  if(r.msg){toast(r.msg);loadBep()} else $('#bepbtn').disabled=true;
}
let TXT_FOLDER=null;
async function openTexts(folder){
  const r=await api('mods_stickers',folder);if(!r)return;TXT_FOLDER=folder;
  $('#modtextsname').textContent=r.name;
  $('#modtextsl').innerHTML=r.stickers.map(s=>`<div class="stxt"><img src="${s.thumb}">
    <input maxlength="40" value="${esc(s.text)}" placeholder="${esc(s.default)}" data-key="${esc(s.key)}"
      onchange="saveText(this)" onkeydown="if(event.key==='Enter')this.blur()"></div>`).join('');
  $('#modtexts').classList.add('on');
}
async function saveText(el){
  const r=await api('mods_set_text',TXT_FOLDER,el.dataset.key,el.value);
  if(r&&r.error){toast(r.error);return}
  if(r){el.value=r.text;toast(T('mods_text_saved'))}
}
function closeTexts(){$('#modtexts').classList.remove('on')}
function openMods(){modTab(MODTAB);$('#mods').classList.add('on');loadMods();loadBep();loadCursor();loadGuest();loadModels()}
async function loadGuest(){const r=await api('guest_mods');if(r)$('#guestmods').value=r.mode}
async function guestMods(v){const r=await api('guest_mods',v);if(r)$('#guestmods').value=r.mode}
let CUR=null;
function showCursor(st){
  if(!st)return; if(st.error){toast(st.error);return}
  CUR=st;
  const img=$('#curimg'); img.style.display=st.exists?'block':'none'; if(st.exists)img.src=st.thumb;
  $('#curstatus').textContent=T(!st.exists?'cursor_none':(st.enabled?'cursor_on':'cursor_off'));
  $('#curdesc').textContent=st.exists?T('cursor_desc_on',{size:st.size||'',extra:st.extra.length}):T('cursor_desc_none');
  const h=$('#curhot'); h.style.display=st.exists?'':'none'; h.value=st.hotspot||'tip';
  const b=$('#curtoggle'); b.style.display=st.exists?'':'none'; b.textContent=T(st.enabled?'cursor_disable':'cursor_enable');
  $('#cursorbox').classList.toggle('off',st.exists&&!st.enabled);
}
async function loadCursor(){showCursor(await api('cursor_state'))}
async function cursorPick(){const r=await api('cursor_pick');if(r)showCursor(r)}
async function cursorHot(v){showCursor(await api('cursor_hotspot',v))}
async function cursorToggle(){showCursor(await api('cursor_toggle',!(CUR&&CUR.enabled)))}
async function cursorFolder(){showCursor(await api('cursor_open'))}
function closeMods(){$('#mods').classList.remove('on')}
function answerOffer(ok){$('#modoffer').classList.remove('on');api('answer_mods',ok)}
function answerMods(ok){$('#modask').classList.remove('on');api('answer_mods',ok)}

/* llamadas desde Python */
window.ui={
  update(u){setUpdate(u,true)},
  log(t,kind){const d=document.createElement('div');if(kind)d.className=kind;d.textContent=t;const L=$('#log');L.appendChild(d);L.scrollTop=L.scrollHeight},
  busy(on,title){BUSY=on;$('#panel').style.display=on?'none':'flex';$('#session').classList.toggle('on',on);
    $('#stopbtn').disabled=false;$('#sesstitle').textContent=title||T('session_running');if(on)$('#log').innerHTML=''},
  address(a){$('#addr').classList.toggle('on',!!a);$('#addrtxt').textContent=a||''},
  state(s){render(s)},
  loading(msg){if(msg){$('#loadmsg').textContent=msg;$('#loading').classList.remove('off')}else $('#loading').classList.add('off')},
  error(t){toast(t)},
  bepProgress(t){$('#bepstatus').textContent=t},
  bepDone(t,err){toast(t);loadBep()},
  closeOffer(){$('#modoffer').classList.remove('on')},
  confirmOffer(info){
    $('#modoffert').textContent=T('mods_offer_title',{player:info.player});
    $('#modofferp').textContent=T('mods_offer_text',{player:info.player});
    $('#modofferl').innerHTML=(info.mods||[]).map(m=>`<div><b>${esc(m.name)}</b> — ${esc(modCount(m))}</div>`).join('');
    $('#modoffer').classList.add('on')},
  confirmMods(info){
    $('#modaskl').innerHTML=(info.mods||[]).map(m=>`<div><b>${esc(m.name)}</b> — ${esc(modCount(m))}${m.author?' · '+esc(T('mods_by',{author:m.author})):''}</div>`).join('');
    $('#modask').classList.add('on')},
};

/* ---- actualizacion del lanzador: se ofrece con sus novedades y el jugador decide ---- */
let UPD=null;
function mdLine(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>')}
function updNotes(notes){
  if(!notes||!notes.length)return `<div class="none">${esc(T('update_no_notes'))}</div>`;
  let h='';
  for(const n of notes){
    h+=`<div class="v">v${esc(n.version)}<span>${esc(n.date||'')}</span></div>`;
    let ul=false;
    for(const raw of n.text.split('\n')){
      const ln=raw.trim(); if(!ln)continue;
      const m=ln.match(/^[-*•]\s+(.*)$/);
      if(m){if(!ul){h+='<ul>';ul=true}h+=`<li>${mdLine(m[1])}</li>`}
      else{if(ul){h+='</ul>';ul=false}h+=`<div class="ln">${mdLine(ln)}</div>`}
    }
    if(ul)h+='</ul>';
  }
  return h;
}
function setUpdate(u,quiet){
  UPD=u;
  const p=$('#updpill');p.textContent=T('update_pill',{v:u.version});p.classList.add('on');
  const b=$('#bell');b.classList.add('on');b.title=T('update_pill',{v:u.version});
  if(!u.skipped&&!quiet)showUpdate();
}
function showUpdate(){
  if(!UPD)return;
  UPD_FORCE=false;$('#updwarn').classList.remove('on');$('#updbtn').textContent=T('update_now');
  $('#updver').textContent=T('update_ver',{cur:UPD.current,v:UPD.version});
  $('#updnotes').innerHTML=updNotes(UPD.notes);
  $('#update').classList.add('on');
}
async function updateLater(){$('#update').classList.remove('on');await api('update_later')}
let UPD_FORCE=false;
async function updateNow(){
  const r=await api('update_apply',UPD_FORCE);
  if(r&&r.error)return toast(r.error);
  if(r&&r.confirm){            // hay que cerrar el juego / la sesion / otros lanzadores: se avisa antes
    UPD_FORCE=true;const w=$('#updwarn');w.textContent=r.confirm;w.classList.add('on');
    $('#updbtn').textContent=T('update_close_btn');return;
  }
  $('#update').classList.remove('on');
}

async function boot(){
  const s=await api('init');
  if(s) render(s);
  ui.loading(null);
  if(s&&s.update) setUpdate(s.update);
}
window.addEventListener('pywebviewready',boot);
/* Linux / Steam Deck: la pagina va en el navegador y recibe los avisos de Python sondeando */
async function pollEvents(){
  for(;;){
    try{
      const evs=await (await fetch('events')).json();
      for(const e of evs){ try{ ui[e.fn](...e.args) }catch(x){ console.error(x) } }
    }catch(e){ await new Promise(r=>setTimeout(r,3000)) }
  }
}
if(window.CSR_HTTP) window.addEventListener('DOMContentLoaded',()=>{ boot(); pollEvents() });
if(window.MOCK) setTimeout(()=>{ if(!STATE) boot() },50);
</script>
